# Nome usado pelo Spring para identificar a aplicação.
spring.application.name=sistema
# Importa .env quando existe; optional permite iniciar sem o arquivo em outros ambientes.
spring.config.import=optional:file:.env[.properties]
# Lê PORT do ambiente e usa 8080 quando a variável não foi definida.
server.port=${PORT:8080}

# Desenvolvimento do frontend: sempre entrega a versao mais recente dos arquivos estaticos.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.devtools.livereload.enabled=true

# Conexao obrigatoria com o PostgreSQL do Neon. Nao existem valores locais padrao.
# Credenciais vêm de variáveis de ambiente para não serem gravadas no código.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# update faz o Hibernate adequar o esquema às entidades sem recriar as tabelas.
spring.jpa.hibernate.ddl-auto=update
# Evita consultas JPA tardias durante a serialização da resposta HTTP.
spring.jpa.open-in-view=false
# Padroniza datas enviadas ao banco no fuso UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
