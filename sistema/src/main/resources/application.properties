spring.application.name=sistema
server.port=${PORT:8080}

# Usa H2 localmente. Em producao, informe uma URL JDBC do PostgreSQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:barbearia;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Origens separadas por virgula, por exemplo https://meu-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
