spring.application.name=barberpro

# Carrega o .env apenas no desenvolvimento local. No Render, use Environment Variables.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# O Render fornece PORT automaticamente e encaminha o tráfego para esta porta.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# Sessão usada pelos logins de administrador, cliente e profissional.
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# PostgreSQL. DATABASE_URL deve começar com jdbc:postgresql://
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Arquivos estáticos podem usar cache em produção e permanecer sem cache localmente.
spring.web.resources.cache.period=${STATIC_CACHE_SECONDS:0}
spring.web.resources.chain.cache=${STATIC_CACHE_ENABLED:false}
spring.devtools.livereload.enabled=false

# Endpoint recomendado para o Health Check Path do Render: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Nunca devolve stack traces ou detalhes internos nas respostas HTTP.
server.error.include-stacktrace=never
server.error.include-exception=false

# Contas iniciais. Os valores reais devem existir somente nas variáveis de ambiente.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Administrador}
app.professional.default-password=${PROFESSIONAL_DEFAULT_PASSWORD}
