<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="css/paineladmin.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-content">
            <h1>Painel Administrativo</h1>
            <p>Gerenciamento da Barbearia</p>
        </div>
    </header>

    <!-- Conteúdo -->
    <main class="dashboard">

        <!-- CLIENTES -->

        <section>
            <h2>Cadastrar Cliente</h2>

            <form id="clientForm">

                <label for="name">Nome</label>
                <input
                    type="text"
                    id="name"
                    name="nome"
                    placeholder="Digite o nome do cliente"
                    required>

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite o e-mail"
                    required>

                <label for="age">Idade</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Digite a idade"
                    required>

                <input type="submit" value="Cadastrar Cliente">

            </form>

            <p id="message"></p>

        </section>

        <section>

            <h2>Buscar Clientes</h2>

            <div id="showClient"></div>

            <button id="btnBuscar">
                Buscar Clientes
            </button>

        </section>

        <!-- SERVIÇOS -->

        <section>

            <h2>Cadastrar Serviço</h2>

            <form id="formservice">

                <label for="nameService">Nome</label>
                <input
                    type="text"
                    id="nameService"
                    placeholder="Nome do serviço"
                    required>

                <label for="description">Descrição</label>
                <input
                    type="text"
                    id="description"
                    placeholder="Descrição"
                    required>

                <label for="price">Preço</label>
                <input
                    type="number"
                    step="0.01"
                    id="price"
                    placeholder="0,00"
                    required>

                <label for="duration_minutes">Duração (min)</label>
                <input
                    type="number"
                    id="duration_minutes"
                    placeholder="Ex.: 45"
                    required>

                <button type="submit">
                    Cadastrar Serviço
                </button>

            </form>

        </section>

        <section>

            <h2>Lista de Serviços</h2>

            <div id="showServices"></div>

            <button id="btnService">
                Buscar Serviços
            </button>

        </section>

        <!-- PROFISSIONAIS -->

        <section>

            <h2>Cadastrar Profissional</h2>

            <form id="formPro">

                <label for="namePro">Nome</label>
                <input
                    type="text"
                    id="namePro"
                    placeholder="Nome do profissional"
                    required>

                <label for="emailPro">E-mail</label>
                <input
                    type="email"
                    id="emailPro"
                    placeholder="E-mail"
                    required>

                <label for="phonePro">Telefone</label>
                <input
                    type="text"
                    id="phonePro"
                    placeholder="Telefone"
                    required>

                <label for="servicesPro">ID do Serviço</label>
                <input
                    type="number"
                    id="servicesPro"
                    placeholder="Informe o ID do serviço"
                    required>

                <button type="submit">
                    Cadastrar Profissional
                </button>

            </form>

        </section>

        <section>

            <h2>Profissionais</h2>

            <div id="showProfessionals"></div>

            <button id="btnPro">
                Buscar Profissionais
            </button>

        </section>

        <!-- AGENDAMENTOS -->

        <section>

            <h2>Novo Agendamento</h2>

            <form id="formAppointments">

                <label for="clientId">ID do Cliente</label>
                <input
                    type="number"
                    id="clientId"
                    required>

                <label for="professionalId">ID do Profissional</label>
                <input
                    type="number"
                    id="professionalId"
                    required>

                <label for="serviceId">ID do Serviço</label>
                <input
                    type="number"
                    id="serviceId"
                    required>

                <label for="startTime">Data e Hora</label>
                <input
                    type="datetime-local"
                    id="startTime"
                    required>

                <label for="notes">Observações</label>
                <input
                    type="text"
                    id="notes"
                    placeholder="Observações (opcional)">

                <button type="submit">
                    Agendar Horário
                </button>

            </form>

        </section>

        <section>

            <h2>Agendamentos</h2>

            <div id="showAppointments"></div>

            <button id="btnAppointments">
                Buscar Agendamentos
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
